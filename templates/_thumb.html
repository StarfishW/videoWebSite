{# expects `v` #}
<div class="thumb">
  {% if v.thumb %}
    <img src="{{ url_for('thumb', vid=v.id) }}" alt="" loading="lazy">
  {% else %}
    <div class="thumb-placeholder"><span>&#9654;</span><small>{{ v.original_name|ext }}</small></div>
  {% endif %}
  {% if v.duration %}<span class="badge-duration">{{ v.duration|duration }}</span>{% endif %}
</div>
