{% extends "base.html" %}
{% block title %}{{ _('Log in') }} · {{ site_name }}{% endblock %}
{% block content %}
<form class="panel narrow" method="post" action="{{ url_for('login') }}">
  <h1>{{ _('Admin login') }}</h1>
  <p class="hint">{{ _('Log in to upload, edit, and delete videos.') }}</p>
  <input type="hidden" name="csrf" value="{{ csrf_token() }}">
  <input type="hidden" name="next" value="{{ next }}">
  <label>{{ _('Username') }} <input name="username" autocomplete="username" required autofocus></label>
  <label>{{ _('Password') }} <input name="password" type="password" autocomplete="current-password" required></label>
  <button class="btn primary block" type="submit">{{ _('Log in') }}</button>
</form>
{% endblock %}
